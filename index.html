<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voiceflow Booking Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 28px;
    }

    p {
      color: #555;
    }
  </style>
</head>

<body>

  <h1>Voiceflow Booking Test</h1>
  <p>Open the chat and ask: “I want to book a room.”</p>


  <script>
    const RoomBookingFormExtension = {
      name: "RoomBookingForm",
      type: "response",

      match: ({ trace }) =>
        trace.type === "room_booking_form" ||
        trace.payload?.name === "room_booking_form",

      render: ({ trace, element }) => {

        const form = document.createElement("form");

        form.innerHTML = `
          <style>

            .booking-card {
              width: 100%;
              box-sizing: border-box;
              background: white;
              border: 1px solid #e3e3e3;
              border-radius: 14px;
              padding: 16px;
              font-family: inherit;
            }

            .booking-title {
              font-size: 18px;
              font-weight: 600;
              margin-bottom: 16px;
            }

            .booking-grid {
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 12px;
            }

            .booking-field {
              display: flex;
              flex-direction: column;
              gap: 6px;
            }

            .booking-field label {
              font-size: 13px;
              font-weight: 600;
            }

            .booking-field input,
            .booking-field select {
              width: 100%;
              box-sizing: border-box;
              padding: 10px;
              border: 1px solid #ccc;
              border-radius: 8px;
              background: white;
              font: inherit;
            }

            .child-ages {
              margin-top: 12px;
            }

            .booking-button {
              width: 100%;
              margin-top: 16px;
              padding: 12px;
              border: none;
              border-radius: 10px;
              font: inherit;
              font-weight: 600;
              cursor: pointer;
            }

          </style>


          <div class="booking-card">

            <div class="booking-title">
              Check availability
            </div>


            <div class="booking-grid">

              <div class="booking-field">
                <label>Check-in</label>
                <input
                  type="date"
                  name="checkin"
                  required
                />
              </div>


              <div class="booking-field">
                <label>Check-out</label>
                <input
                  type="date"
                  name="checkout"
                  required
                />
              </div>


              <div class="booking-field">
                <label>Adults</label>

                <select name="adults">
                  <option value="1">1</option>
                  <option value="2" selected>2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>

              </div>


              <div class="booking-field">
                <label>Children</label>

                <select name="children">
                  <option value="0" selected>0</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>

              </div>

            </div>


            <div class="child-ages"></div>


            <button
              type="submit"
              class="booking-button"
            >
              View rooms & rates
            </button>

          </div>
        `;


        const childrenSelect =
          form.querySelector('[name="children"]');

        const childAgesContainer =
          form.querySelector(".child-ages");


        function renderChildAges() {

          const count =
            Number(childrenSelect.value);

          childAgesContainer.innerHTML = "";


          if (count === 0) return;


          const grid =
            document.createElement("div");

          grid.className = "booking-grid";


          for (let i = 0; i < count; i++) {

            const field =
              document.createElement("div");

            field.className =
              "booking-field";


            const label =
              document.createElement("label");

            label.textContent =
              `Child ${i + 1} age`;


            const select =
              document.createElement("select");

            select.name =
              `child_age_${i}`;


            for (let age = 0; age <= 17; age++) {

              const option =
                document.createElement("option");

              option.value =
                String(age);

              option.textContent =
                String(age);

              select.appendChild(option);
            }


            field.appendChild(label);

            field.appendChild(select);

            grid.appendChild(field);
          }


          childAgesContainer.appendChild(grid);
        }


        childrenSelect.addEventListener(
          "change",
          renderChildAges
        );


        form.addEventListener(
          "submit",
          (event) => {

            event.preventDefault();


            const checkin =
              form.querySelector(
                '[name="checkin"]'
              ).value;


            const checkout =
              form.querySelector(
                '[name="checkout"]'
              ).value;


            const adults =
              form.querySelector(
                '[name="adults"]'
              ).value;


            const ageFields =
              form.querySelectorAll(
                '[name^="child_age_"]'
              );


            const childrenAges =
              Array.from(ageFields).map(
                field => field.value
              );


            if (!checkin || !checkout) {
              return;
            }


            const button =
              form.querySelector(
                ".booking-button"
              );


    button.disabled = true;
button.textContent = "Search ready ✓";

form.querySelectorAll("input, select").forEach((field) => {
  field.disabled = true;
});


            window.voiceflow.chat.interact({
              type: "room_booking_submitted",

              payload: {
                checkin: checkin,
                checkout: checkout,
                adults: adults,
                children_ages:
                  childrenAges.join(",")
              }
            });

          }
        );


        element.appendChild(form);
      }
    };
  </script>


  <script type="text/javascript">

    (function(d, t) {

      var v = d.createElement(t),
          s = d.getElementsByTagName(t)[0];


      v.onload = function() {

        window.voiceflow.chat.load({

          verify: {
            projectID:
              "6a67b2a798f0eb571d99627f"
          },

          url:
            "https://general-runtime.voiceflow.com",

          voice: {
            url:
              "https://runtime-api.voiceflow.com"
          },

          assistant: {
            extensions: [
              RoomBookingFormExtension
            ]
          }

        });

      };


      v.src =
        "https://cdn.voiceflow.com/widget-next/bundle.mjs";

      v.type =
        "text/javascript";

      s.parentNode.insertBefore(v, s);


    })(document, "script");

  </script>

</body>
</html>
