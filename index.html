<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Victoria Lauberhorn | Digital Concierge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(
          rgba(18, 27, 24, 0.48),
          rgba(18, 27, 24, 0.62)
        ),
        url("https://images.unsplash.com/photo-1502784444187-359ac186c5bb?auto=format&fit=crop&w=2000&q=85");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
    }

    .page-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .hero {
      width: 100%;
      max-width: 780px;
      text-align: center;
      padding: 56px 42px;
      border-radius: 28px;
      background: rgba(20, 30, 27, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
    }

    .eyebrow {
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.82;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 68px);
      line-height: 1.02;
      font-weight: 650;
      letter-spacing: -0.04em;
    }

    .subtitle {
      max-width: 580px;
      margin: 24px auto 0;
      font-size: 18px;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.88);
    }

    .concierge-note {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 32px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 14px;
      color: rgba(255, 255, 255, 0.94);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #bde7c6;
      box-shadow: 0 0 0 5px rgba(189, 231, 198, 0.12);
    }

    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.62);
    }

    @media (max-width: 600px) {
      .page-shell {
        padding: 18px;
      }

      .hero {
        padding: 40px 22px;
        border-radius: 22px;
      }

      .subtitle {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="page-shell">
    <section class="hero">
      <div class="eyebrow">Wengen · Switzerland</div>

      <h1>Hotel Victoria Lauberhorn</h1>

      <p class="subtitle">
        Your digital concierge for rooms, dining, spa, arrival information,
        local recommendations and reservations.
      </p>

      <div class="concierge-note">
        <span class="status-dot"></span>
        Open the chat to speak with Carven
      </div>

      <div class="footer-note">
        Available anytime for hotel information and guest support.
      </div>
    </section>
  </main>


     };
  </script>

  <script>
    const BookingLinkExtension = {
      name: "BookingLink",
      type: "response",

      match: ({ trace }) =>
        trace.type === "BOOKING_LINK",

      render: ({ trace, element }) => {
        const url = trace.payload?.url;

        if (!url) return;

        const wrapper = document.createElement("div");

        wrapper.innerHTML = `
          <style>
            .rates-card {
              width: 100%;
              box-sizing: border-box;
              padding: 18px;
              background: #ffffff;
              border: 1px solid rgba(20, 20, 20, 0.08);
              border-radius: 16px;
              box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.03),
                0 8px 24px rgba(0, 0, 0, 0.06);
              font-family: inherit;
            }

            .rates-card-title {
              margin: 0 0 6px;
              font-size: 17px;
              line-height: 1.3;
              font-weight: 650;
              color: #171717;
            }

            .rates-card-text {
              margin: 0 0 16px;
              font-size: 13.5px;
              line-height: 1.55;
              color: #686868;
            }

            .rates-card-button {
              display: flex;
              align-items: center;
              justify-content: space-between;
              width: 100%;
              box-sizing: border-box;
              padding: 13px 15px;
              border-radius: 10px;
              background: #1f1f1f;
              color: #ffffff !important;
              text-decoration: none;
              font-size: 13.5px;
              font-weight: 600;
              transition:
                transform 150ms ease,
                box-shadow 150ms ease,
                background 150ms ease;
            }

            .rates-card-button:hover {
              background: #2b2b2b;
              transform: translateY(-1px);
              box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            }

            .rates-card-arrow {
              font-size: 16px;
              line-height: 1;
              transition: transform 150ms ease;
            }

            .rates-card-button:hover .rates-card-arrow {
              transform: translateX(3px);
            }
          </style>

          <div class="rates-card">
            <div class="rates-card-title">
              Rooms &amp; rates
            </div>

            <div class="rates-card-text">
              View the available rooms and current rates for your selected dates.
            </div>

            <a
              class="rates-card-button"
              href="${url}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span>View rooms &amp; rates</span>
              <span class="rates-card-arrow">→</span>
            </a>
          </div>
        `;

        element.appendChild(wrapper);
      }
    };
  </script>


  <script type="text/javascript">

    (function(d, t) {

      var v = d.createElement(t),
          s = d.getElementsByTagName(t)[0];


      v.onload = function() {

        window.voiceflow.chat.load({

          verify: {
            projectID:
              "6a67b2a798f0eb571d99627f"
          },

          url:
            "https://general-runtime.voiceflow.com",

          voice: {
            url:
              "https://runtime-api.voiceflow.com"
          },

          assistant: {
  extensions: [
    RoomBookingFormExtension,
    BookingLinkExtension
  ]
}

});

};


v.src =
  "https://cdn.voiceflow.com/widget-next/bundle.mjs";

v.type =
  "text/javascript";

s.parentNode.insertBefore(v, s);


})(document, "script");

</script>

</body>
</html>
